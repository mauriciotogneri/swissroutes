<body>

  <div id="map"></div>

  <div class="map-controls">

      <button type="button" data-map-type="roadmap" aria-pressed="true">Map</button>
      <button type="button" data-map-type="terrain" aria-pressed="false">Terrain</button>
      <button type="button" data-map-type="hybrid" aria-pressed="false">Satellite</button>
    </div>
    <div class="zoom">
      <button type="button" id="zoomIn" aria-label="Zoom in"><span class="material-symbols-outlined">add</span></button>
      <button type="button" id="zoomOut" aria-label="Zoom out"><span class="material-symbols-outlined">remove</span></button>
