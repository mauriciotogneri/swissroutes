    <h1 class="visually-hidden">Swiss Routes: hiking, cycling and mountain bike routes in Switzerland</h1>
    <div id="map"></div>
  </main>

  <div class="visually-hidden" id="status" role="status"></div>

  <aside class="panel layers" id="layersPanel" aria-label="Map layers">
    <div class="progress" id="progress" role="progressbar" aria-label="Loading map data" aria-valuemin="0"
      aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="panel-head">
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false"
        aria-controls="menu"><span class="material-symbols-outlined">menu</span><span class="badge menu-badge" id="menuBadge" hidden></span></button>
      <span class="brand">Swiss Routes</span>
      <button type="button" class="clear-all" id="clearAll" hidden>Clear all</button>
    </div>
    <div class="layers-body" id="layers"></div>
    <div class="menu" id="menu" inert>
      <button type="button" class="menu-item" id="uploadButton"><span class="material-symbols-outlined">upload</span>Upload GPX</button>

      <p class="upload-error" id="uploadError" role="alert" hidden></p>
      <div id="menuSaved"></div>
    </div>
  </aside>

  <aside class="panel details" id="details" aria-label="Selected item" inert></aside>

  <div class="map-controls">
    <div class="map-type" role="group" aria-label="Map type">
      <button type="button" data-map-type="roadmap" aria-pressed="true">Map</button>
      <button type="button" data-map-type="terrain" aria-pressed="false">Terrain</button>
      <button type="button" data-map-type="hybrid" aria-pressed="false">Satellite</button>
    </div>
    <div class="zoom">
      <button type="button" id="zoomIn" aria-label="Zoom in"><span class="material-symbols-outlined">add</span></button>
      <button type="button" id="zoomOut" aria-label="Zoom out"><span class="material-symbols-outlined">remove</span></button>
    </div>
  </div>

  <input type="file" id="gpxInput" accept=".gpx,application/gpx+xml" hidden>

  <div class="tooltip" id="tooltip" hidden></div>

  <dialog class="confirm" id="confirm" aria-labelledby="confirmTitle" aria-describedby="confirmText">

      <div class="confirm-actions">
